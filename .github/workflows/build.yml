name: Build Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RIZ_DOORSTOP_VS_YEAR: '2022'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Install the native export verifier dependency
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26

      - name: Build Runtime and plugin SDK
        shell: pwsh
        run: ./scripts/Build.ps1 -SkipTests -PackageKind Runtime

      - name: Upload Runtime preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RizToolbox-Windows-x64-Runtime
          path: |
            artifacts/package/
            artifacts/package-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload plugin SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RizToolbox-Plugin-SDK
          path: |
            artifacts/sdk/*.nupkg
            artifacts/sdk/sdk-manifest.json
          if-no-files-found: error
          retention-days: 14
