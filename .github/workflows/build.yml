name: Build Windows x64

on:
  push:
    branches: [main, 'candidates/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RIZ_DOORSTOP_VS_YEAR: '2022'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Enable long Git paths on Windows
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Check paired-run diagnostics
        run: python -B -m unittest discover -s scripts/diagnostics -p test_same_session.py

      - name: Install the native export verifier dependency
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26

      - name: Build Runtime, Basic, and plugin author distributions
        shell: pwsh
        run: ./scripts/Build.ps1 -SkipTests -PackageKind Runtime,Basic,Author

      - name: Check the LOCAL browser and selection lifetime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project tests/RizToolbox.UiInput.Tests -c Release
          dotnet run --project tests/RizToolbox.AudioContent.Tests -c Release -- --isolated-case 'LOCAL selection module retirement closes old play requests and preserves accepted result observations'

      - name: Package and verify installable Runtime and Basic previews
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/PackageDistribution.Common.ps1
          $archives = @{
            Runtime = @{ Distribution = 'artifacts'; Output = 'runtime-preview' }
            Basic = @{ Distribution = 'artifacts/basic'; Output = 'basic-preview' }
          }
          $deliveryRoots = @{}
          foreach ($edition in 'Runtime','Basic') {
            $archive = $archives[$edition]
            $delivery = ./scripts/New-PreviewDelivery.ps1 -DistributionDirectory (Join-Path $env:GITHUB_WORKSPACE $archive.Distribution) `
              -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory (Join-Path $env:RUNNER_TEMP $archive.Output) `
              -Label "RizToolbox-Windows-x64-$edition"
            $extracted = Join-Path $env:RUNNER_TEMP "$($archive.Output)-extracted"
            [IO.Compression.ZipFile]::ExtractToDirectory($delivery.ArchivePath, $extracted)
            $deliveryRoot = Join-Path $extracted 'delivery'
            $deliveryRoots[$edition] = $deliveryRoot
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $deliveryRoot 'artifacts/package-manifest.json') | ConvertFrom-Json -AsHashtable
            Assert-RuntimeDistribution (Join-Path $deliveryRoot 'artifacts/package') $manifest 'Runtime'
            $expectedPlugins = @(if ($edition -eq 'Basic') { Get-DistributionBasicPluginIds })
            if ($manifest.basicPlugins.Count -ne $expectedPlugins.Count -or
                @($manifest.basicPlugins | Where-Object { $_ -cnotin $expectedPlugins }).Count) {
              throw "$edition ZIP has an unexpected basicPlugins selection."
            }
          }

          $sharedFiles = @(Get-RuntimeDistributionPaths | ForEach-Object { "artifacts/package/$_" }) + '.tools/bepinex-789.zip'
          foreach ($relative in $sharedFiles) {
            $runtimeHash = Get-DistributionHash (Join-Path $deliveryRoots.Runtime $relative)
            $basicHash = Get-DistributionHash (Join-Path $deliveryRoots.Basic $relative)
            if ($runtimeHash -cne $basicHash) { throw "Runtime and Basic ZIPs differ at $relative." }
          }
          Write-Host "Verified $($sharedFiles.Count) shared files in the extracted Runtime and Basic ZIPs."

      - name: Test host commands from the Basic player ZIP
        shell: pwsh
        run: |
          $sender = Join-Path $env:RUNNER_TEMP 'basic-preview-extracted/delivery/scripts/Send-HostCommand.ps1'
          pwsh -NoProfile -File ./scripts/Test-HostCommandSender.ps1 -SenderPath $sender

      - name: Upload Runtime preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/runtime-preview/RizToolbox-Windows-x64-Runtime.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Basic player preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/basic-preview/RizToolbox-Windows-x64-Basic.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload plugin SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RizToolbox-Plugin-SDK
          path: |
            artifacts/sdk/*.nupkg
            artifacts/sdk/sdk-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Package author kit and compile a plugin from the ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $kit = Join-Path $env:RUNNER_TEMP 'author-kit'
          $zip = Join-Path $env:RUNNER_TEMP 'RizToolbox-Plugin-Author-Kit.zip'
          Copy-Item -LiteralPath 'artifacts/author/package/author' -Destination $kit -Recurse
          Copy-Item -LiteralPath 'templates/author-kit/README.md','templates/author-kit/NuGet.Config','LICENSE' -Destination $kit
          [IO.Compression.ZipFile]::CreateFromDirectory($kit, $zip)

          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked-author-kit'
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $unpacked)
          $hive = Join-Path $env:RUNNER_TEMP 'author-template-hive'
          $project = Join-Path $env:RUNNER_TEMP 'WikiHello'
          dotnet new install (Join-Path $unpacked 'templates/riz-plugin') --debug:custom-hive $hive
          dotnet new riz-plugin --name WikiHello --PluginId wiki.hello --output $project --debug:custom-hive $hive
          dotnet restore "$project/WikiHello.csproj" --configfile "$unpacked/NuGet.Config" --packages "$env:RUNNER_TEMP/author-packages"
          $sdk = Get-Content "$unpacked/sdk/sdk-manifest.json" -Raw | ConvertFrom-Json
          $cachedSdk = Join-Path "$env:RUNNER_TEMP/author-packages/riztoolbox.sdk/$($sdk.sdkContractVersion)" $sdk.package.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $cachedSdk).Hash -ne $sdk.sha256) { throw 'Restored SDK differs from the kit.' }
          dotnet build "$project/WikiHello.csproj" --configuration Release --no-restore
          $output = Join-Path $project 'bin/Release/net6.0'
          if (!(Test-Path "$output/WikiHello.dll") -or
              (Get-Content "$output/plugin.json" -Raw | ConvertFrom-Json).id -cne 'wiki.hello' -or
              (Test-Path "$output/RizToolbox.Sdk.dll")) { throw 'Unexpected template plugin output.' }

          $songTemplate = Join-Path $unpacked 'templates/riz-song'
          $browserTool = Join-Path $unpacked 'tools/tools.local-catalog'
          $browserManifest = Get-Content "$browserTool/plugin.json" -Raw | ConvertFrom-Json
          if ($browserManifest.id -cne 'tools.local-catalog' -or $browserManifest.entryType -cne 'RizToolbox.Examples.LocalCatalogBrowserPlugin' -or
              $browserManifest.entryAssembly -cne 'RizToolbox.Examples.dll' -or !(Test-Path "$browserTool/RizToolbox.Examples.dll")) {
            throw 'The author kit is missing the LOCAL catalog tool.'
          }
          $songProject = Join-Path $env:RUNNER_TEMP 'TideSignal'
          dotnet new install $songTemplate --debug:custom-hive $hive
          dotnet new riz-song --name TideSignal --PluginId demo.tide-signal --output $songProject --debug:custom-hive $hive
          dotnet restore "$songProject/TideSignal.csproj" --configfile "$unpacked/NuGet.Config" --packages "$env:RUNNER_TEMP/author-packages"
          dotnet build "$songProject/TideSignal.csproj" --configuration Release --no-restore
          $songOutput = Join-Path $songProject 'bin/Release/net6.0'
          $songPackage = Get-Content "$songOutput/plugin.json" -Raw | ConvertFrom-Json
          if ($songPackage.id -cne 'demo.tide-signal' -or $songPackage.entryAssembly -cne 'TideSignal.dll' -or
              !(Test-Path "$songOutput/TideSignal.dll") -or (Test-Path "$songOutput/RizToolbox.Sdk.dll")) {
            throw 'Unexpected LOCAL song plugin output.'
          }
          foreach ($asset in 'chart.json','song.wav','cover.png') {
            if ((Get-FileHash "$songTemplate/assets/$asset").Hash -cne (Get-FileHash "$songOutput/assets/$asset").Hash) {
              throw "The generated plugin changed the packaged asset: $asset"
            }
          }

          $mods = Join-Path $env:RUNNER_TEMP 'song-demo-mods'
          $song = New-Item -ItemType Directory -Path "$mods/demo.tide-signal"
          Copy-Item -LiteralPath "$songOutput/TideSignal.dll","$songOutput/plugin.json" -Destination $song
          Copy-Item -LiteralPath "$songOutput/assets" -Destination $song -Recurse
          Copy-Item -LiteralPath $browserTool -Destination $mods -Recurse
          $demoZip = Join-Path $env:RUNNER_TEMP 'TideSignal-LOCAL-Mods.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($mods, $demoZip)
          $archive = [IO.Compression.ZipFile]::OpenRead($demoZip)
          try {
            $expected = 'demo.tide-signal/TideSignal.dll','demo.tide-signal/plugin.json','demo.tide-signal/assets/chart.json','demo.tide-signal/assets/song.wav','demo.tide-signal/assets/cover.png','tools.local-catalog/plugin.json','tools.local-catalog/RizToolbox.Examples.dll'
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            if (Compare-Object $expected $entries -CaseSensitive) { throw 'Unexpected LOCAL demo ZIP contents.' }
          } finally { $archive.Dispose() }

      - name: Upload plugin author kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/RizToolbox-Plugin-Author-Kit.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload playable LOCAL demo and catalog browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/TideSignal-LOCAL-Mods.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
